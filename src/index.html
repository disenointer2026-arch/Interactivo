<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MINISO × Animal Crossing — Crea tu avatar</title>
    <meta name="description" content="Prototipo académico: crea y personaliza tu avatar en 3D, pide tu producto físico y genera tu tarjeta coleccionable." />
    <meta name="theme-color" content="#FFFBF2" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet" />
    <!-- Estilos de la capa de carga: van aquí porque debe verse antes de que
         llegue el CSS del sitio (que viaja con el JS). Es la misma interfaz que
         "Procesando tu pago": velo con desenfoque, hoja y mensaje. -->
    <style>
      body { background: #F6F4CA; }
      #boot {
        position: fixed; inset: 0; z-index: 200; display: grid; place-items: center;
        background: rgba(246, 244, 202, .9); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
        transition: opacity .6s ease, backdrop-filter .6s ease;
        font-family: 'Nunito', system-ui, sans-serif; color: #3A2E28; text-align: center;
      }
      #boot .boot-card { display: grid; justify-items: center; gap: 6px; }
      #boot .boot-leaf {
        display: block; width: 60px; height: 56px; background: #5DBC41;
        -webkit-mask: url('images/ui/boton-llavero.svg') center / contain no-repeat;
        mask: url('images/ui/boton-llavero.svg') center / contain no-repeat;
        animation: boot-float 2.4s ease-in-out infinite;
      }
      #boot p { font-weight: 800; font-size: 1.4rem; margin: 10px 0 0; }
      #boot small { color: #6B5C52; font-weight: 700; }
      #boot.is-done { opacity: 0; backdrop-filter: blur(0); pointer-events: none; }
      /* Misma flotación que la hoja de "Procesando tu pago" */
      @keyframes boot-float { 0%, 100% { scale: 1.05; rotate: 0deg; } 25% { scale: 1.08; rotate: 2deg; } 75% { scale: 1.08; rotate: -2deg; } }
      @keyframes boot-pop { 0% { opacity: 0; scale: .7; } 60% { opacity: 1; scale: 1.08; } 100% { opacity: 1; scale: 1; } }
      #boot p.is-welcome { animation: boot-pop .5s cubic-bezier(.34, 1.56, .64, 1) both; }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-leaf, #boot p.is-welcome { animation: none; }
      }
    </style>
  </head>
  <body data-route="home">
    <div id="boot" role="status" aria-live="polite">
      <div class="boot-card">
        <span class="boot-leaf" aria-hidden="true"></span>
        <p data-boot-title>Procesando…</p>
        <small data-boot-note>Espera un momento</small>
      </div>
    </div>
    <a class="skip-link" href="#app">Saltar al contenido</a>
    <header id="site-header" class="site-header"></header>
    <main id="app" tabindex="-1"></main>
    <footer id="site-footer" class="site-footer"></footer>
    <script type="module" src="./script.js"></script>
  </body>
</html>
